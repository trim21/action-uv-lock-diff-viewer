name: "uv.lock diff viewer"
description: "Comment a markdown table of version changes for every uv.lock a pull request touches"
author: "Trim21 <trim21.me@gmail.com>"
branding:
  icon: chevron-down
  color: blue
inputs:
  token:
    description: "github token"
    default: "${{ github.token }}"
    required: false

runs:
  using: "node24"
  main: "dist/index.js"
